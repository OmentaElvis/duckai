name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test & build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build (linux x64)
        run: bun run build

      - name: Package .deb
        run: bun run build:deb

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: duckai-linux-x64
          path: |
            dist/duckai
            dist/*.deb
          if-no-files-found: error

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Windows-host build: embeds assets/duckai.ico and hides the console.
      # (Cross-compiling from Linux cannot embed the icon — Windows-only flag.)
      - name: Build executable (windows x64)
        run: bun run build:win:release

      - name: Verify GUI subsystem (no console window)
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("dist/duckai.exe")
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          Write-Host "PE subsystem: $subsystem (2 = GUI, 3 = console)"
          if ($subsystem -ne 2) { throw "expected GUI subsystem (2), got $subsystem" }

      # libwebview.dll needs the MSVC 2015-2022 runtime, which Windows does not
      # ship. Stage it beside the exe so clean machines can dlopen it.
      - name: Stage VC++ runtime
        run: bun run stage:win-runtime

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore WiX (pinned in .config/dotnet-tools.json)
        run: dotnet tool restore

      - name: Build MSI installer
        run: bun run build:msi

      - name: Package portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/duckai.exe, dist/*.dll -DestinationPath dist/duckai-windows-x64.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duckai-windows-x64
          path: |
            dist/duckai.exe
            dist/duckai-windows-x64.zip
            dist/duckai_*_x64.msi
          if-no-files-found: error
